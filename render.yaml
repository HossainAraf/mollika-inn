databases:
- name: utd_bd
  databaseName: utd_bd
  type: postgresql
  user: utd_bd_user
  plan: free
  region: oregon
  ipAllowList: []
  postgresMajorVersion: "18"

services:
- type: web
  name: hotel-booking
  runtime: ruby
  repo: https://github.com/HossainAraf/mollika-inn.git
  branch: deploy
  plan: free
  envVars:
  - key: RAILS_MASTER_KEY
    sync: false
  - key: DATABASE_URL
    fromDatabase:
      name: utd_bd
      property: connectionString
  - key: RENDER
    value: "true"
  region: oregon
  buildCommand: ./bin/render-build.sh
  startCommand: ./bin/start.sh