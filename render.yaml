services:
- type: web
  name: hotel-booking
  runtime: ruby
  repo: https://github.com/HossainAraf/mollika-inn.git
  branch: deploy
  plan: free
  envVars:
  - key: RAILS_MASTER_KEY
    sync: false
  - key: DATABASE_URL
    fromDatabase:
      name: utd_bd
      property: connectionString
  - key: RENDER
    value: "true"
  - key: RAILS_ENV
    value: production
  - key: RAILS_LOG_TO_STDOUT
    value: "true"
  region: oregon
  buildCommand: ./bin/render-build.sh
  startCommand: ./bin/start.sh
  healthCheckPath: /health